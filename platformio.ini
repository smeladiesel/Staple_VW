[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:black_f407ze]
platform = ststm32
board = black_f407ze
framework = stm32cube
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -ICore/Inc
    -Wl,-u,_printf_float
monitor_speed = 115200
upload_protocol = stlink
upload_flags =
    -c
    adapter speed 1000
